name: Build Windows, Mac and Web

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma que se compilará
        type: choice
        options: [all, windows, mac, web]
        default: all
      validate_only:
        description: Solo verificar la conexión y los targets, sin consumir minutos de build
        type: boolean
        default: true
      clean:
        description: Reimportar el proyecto sin reutilizar la caché de Unity Cloud
        type: boolean
        default: false
      timeout_minutes:
        description: Tiempo máximo por plataforma (1 a 100 minutos)
        type: number
        default: 90

permissions:
  contents: read

concurrency:
  group: unity-cloud-builds-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Unity Build Automation
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Checkout pipeline and project settings
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            ProjectSettings
          lfs: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify cloud orchestration
        run: node --test .github/scripts/unity-build.test.mjs

      - name: Build or validate Unity Cloud targets
        env:
          UNITY_ORG_ID: ${{ vars.UNITY_ORG_ID }}
          UNITY_PROJECT_ID: ${{ vars.UNITY_PROJECT_ID }}
          UNITY_BUILD_TARGET_WINDOWS: ${{ vars.UNITY_BUILD_TARGET_WINDOWS }}
          UNITY_BUILD_TARGET_MAC: ${{ vars.UNITY_BUILD_TARGET_MAC }}
          UNITY_BUILD_TARGET_WEB: ${{ vars.UNITY_BUILD_TARGET_WEB }}
          UNITY_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_KEY_ID }}
          UNITY_SERVICE_ACCOUNT_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET }}
          BUILD_PLATFORMS: ${{ inputs.platform || 'all' }}
          BUILD_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || '' }}
          BUILD_VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only }}
          BUILD_CLEAN: ${{ inputs.clean || false }}
          BUILD_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes || 90 }}
        run: node .github/scripts/unity-build.mjs

      - name: Verify downloaded ZIP files
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.validate_only)
        run: |
          for archive in builds/cloud/*.zip; do
            unzip -t "$archive" > /dev/null
          done

      - name: Upload build artifacts and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manners-cloud-${{ github.run_id }}-${{ github.run_attempt }}
          path: builds/cloud/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Attach verified builds to release
        if: success() && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" builds/cloud/*.zip builds/cloud/unity-build-results.json --clobber
