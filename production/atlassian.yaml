# Integración de manners.exe con Jira y Confluence (Claude Code Game Studios).
#
# Fuente de verdad: Jira para épicas, historias, sprints y bugs; Confluence para la
# documentación. Los archivos locales que leen los skills del framework son espejos
# con un bloque `atlassian-mirror` al principio (ver .claude/scripts/atlassian-mirror.sh
# y .claude/docs/atlassian-mapping.md).
#
# Lo escriben /atlassian-setup (descubrimiento) y /atlassian-sync (páginas nuevas),
# siempre después de mostrar el cambio. Sin secretos: cada persona entra con su cuenta
# en el servidor MCP "atlassian" de .mcp.json (OAuth con /mcp).

schema_version: 1

site:
  url: "https://blackdoorstudios.atlassian.net"
  cloud_id: "31a87ea2-9c7f-4184-b53d-75dd8851337e"

jira:
  project_key: "MAN"
  board_id: 34                  # tablero simple (team-managed): Por hacer · En curso · En revisión · Listo
  board_url: "https://blackdoorstudios.atlassian.net/jira/software/projects/MAN/boards/34/backlog"
  issue_types:                  # nombre en Jira -> epic | story | bug | subtask
    "Epic": epic
    "Tarea": story
    "Historia": story
    "Función": story
    "Error": bug
    "Subtask": subtask
  status_map:                   # estado de Jira -> Not Started | Ready | In Progress | In Review | Complete | Blocked
    "Por hacer": Not Started
    "En curso": In Progress
    "En revisión": In Review
    "Listo": Complete
  todo_in_sprint: Ready         # "Por hacer" dentro del sprint activo, o del siguiente si no hay activo
  flagged_is: Blocked           # MAN no tiene estado de bloqueo: Flagged (customfield_10021) marca Blocked
  transitions:                  # estado del framework -> transición (todas las transiciones están abiertas)
    Not Started: { id: "11", to: "Por hacer" }
    Ready: { id: "11", to: "Por hacer" }
    In Progress: { id: "21", to: "En curso" }
    In Review: { id: "31", to: "En revisión" }
    Complete: { id: "41", to: "Listo" }
  fields:
    story_points: customfield_10016
    sprint: customfield_10020
    rank: customfield_10019
    flagged: customfield_10021
    start_date: customfield_10015
    parent: parent
  priority_map:                 # prioridad de Jira -> prioridad de sprint-status.yaml
    "Highest": must-have
    "High": must-have
    "Medium": should-have
    "Low": nice-to-have
    "Lowest": nice-to-have
  type_labels: {}               # MAN no usa etiquetas ni componentes: el Type lo fija /story-readiness
  no_epic_slug: "sin-epica"     # carpeta de production/epics/ para historias sin épica
  mirror_scope: open            # open: épicas + issues abiertos (lo cerrado queda listado en cada EPIC.md); all: todo

