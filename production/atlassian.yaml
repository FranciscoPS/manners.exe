  space_id: "196610"
  new_pages_parent_id: ""       # vacío = root_folder_id
  pages:                        # type: page | live_doc · rich: contenido que no se convierte a Markdown
    - { id: "425985", title: "Introducción y Descripción General", path: "design/gdd/game-concept.md", type: page, origin: confluence, rich: false }
